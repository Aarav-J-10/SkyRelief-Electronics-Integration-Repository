<text x="832" y="599" class="small">role</text>

<text x="30" y="650" class="small">C11 is a separate FPV branch, not a Pixhawk-powered camera: arrow means architectural association only.</text>
<text x="30" y="672" class="small">Telemetry is a bidirectional functional role; exact UART contacts and settings remain unverified.</text>
<text x="30" y="694" class="small">Servo conductors near I2C are unassigned. No servo positive/return, MAIN OUT channel or range pin is allocated.</text>
