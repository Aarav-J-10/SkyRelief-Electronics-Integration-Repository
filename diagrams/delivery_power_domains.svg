<text x="35" y="465" class="s">REFERENCE: External 4.8 V -&gt; servo supply; PWM -&gt; servo command; both sources -&gt; common return.</text>
<text x="35" y="484" class="s">No historical servo positive or return net is drawn. POWER does not inherently energize output rail.</text>
