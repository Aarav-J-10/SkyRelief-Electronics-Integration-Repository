<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17252f}.h{font-size:22px;font-weight:bold}.s{font-size:14px}.b{font-size:17px;font-weight:bold}</style>
<text x="35" y="45" class="h">Delivery UAV / functional reconstruction</text>
<text x="35" y="75" class="s">Layer 1: module roles from authored sketch; no connector-level harness</text>
<rect x="45" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="57" y="153" class="b">LiPo / PDB</text>
<text x="57" y="177" class="s">3S / 11.1 V nominal label</text>
<rect x="370" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="382" y="153" class="b">4 ESCs / 4 motors</text>
<text x="382" y="177" class="s">30 A labels; 2212 920 KV family</text>
<rect x="695" y="125" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="707" y="153" class="b">Pixhawk 2.4.8 family</text>
<text x="707" y="177" class="s">RC, GPS, telemetry boundaries</text>
<rect x="45" y="280" width="260" height="90" fill="#f3f6f8" stroke="#344350"/>
<text x="57" y="308" class="b">Release / ranging</text>
<text x="57" y="332" class="s">Rail, output and sensor unknown</text>
<text x="35" y="465" class="s">POWER: Battery -&gt; PDB -&gt; four ESC branches -&gt; four three-phase motor groups [C01-C03].</text>
<text x="35" y="484" class="s">CONTROL: Pixhawk -&gt; ESC command boundary [C04]; no actual channel/order assigned.</text>
<text x="35" y="503" class="s">Servo is not assigned I2C. FPV UBEC and power-module roles remain separate domains.</text>
<defs><marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#344350"/></marker></defs><path d="M307 170H367" stroke="#344350" fill="none" stroke-width="1.3" marker-end="url(#flowarrow)"/><path d="M692 170H632" stroke="#344350" fill="none" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#flowarrow)"/><path d="M825 217V250H175V278" stroke="#344350" fill="none" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#flowarrow)"/><text x="35" y="620" font-family="Arial,sans-serif" font-size="12">Arrows = functional roles, never physical wiring; dashed = unresolved implementation.</text></svg>
